global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: business-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [business-service:8080]
  # Gateway 是后期微服务拆分储备，默认 profile 不启动，因此不创建永久 DOWN 的抓取目标。
  # 启用 microservices profile 后，可把 gateway:8088 作为第二个 job 加回。
