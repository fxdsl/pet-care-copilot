global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: business-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [business-service:8080]
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8088]
