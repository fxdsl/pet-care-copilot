# 单体默认入口使用 Nginx 基础 IP 限流；登录等精确业务限流仍由 Spring Boot + Redis 完成。
limit_req_zone $binary_remote_addr zone=business_api_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=business_api_per_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://business-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自带的关联信息，Spring Boot 使用可信的新请求编号写结构化日志。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        limit_req zone=business_api_per_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://business-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
